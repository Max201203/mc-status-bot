name: Minecraft-Status

on:
  schedule:
    - cron: "*/5 * * * *"    # alle 5 Minuten, kürzer erlaubt GitHub nicht (startet manchmal auch später)
  workflow_dispatch:          # zum Testen per Klick auf "Run workflow"

permissions:
  contents: write             # damit die ID der Statusnachricht gespeichert werden kann

concurrency:
  group: mc-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Immer den neuesten Stand holen (auch bei "Re-run"), damit die
      # gespeicherte Nachrichten-ID gefunden wird.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install "mcstatus==14.*"

      # Geplante Läufe prüfen 3-mal im Abstand von ~2 Minuten (0, 2, 4 min),
      # damit der Status trotz 5-Minuten-Zeitplan alle ~2 Minuten neu ist.
      # Manuelle Läufe ("Run workflow") prüfen nur einmal, damit Tests schnell gehen.
      - name: Status prüfen und Discord-Nachricht aktualisieren
        env:
          MC_SERVER_ADDRESS: ${{ secrets.MC_SERVER_ADDRESS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          START_LINK: ${{ secrets.START_LINK }}
          CHECKS: ${{ github.event_name == 'schedule' && 3 || 1 }}
        run: |
          failed=0
          for i in $(seq 1 "$CHECKS"); do
            python status.py || failed=1
            if [ "$i" -lt "$CHECKS" ]; then
              sleep 110
            fi
          done
          exit $failed

      # Speichert die Nachrichten-ID beim ersten Lauf. Außerdem ein kleiner
      # Commit alle ~50 Tage, damit GitHub den Zeitplan nicht wegen
      # "keine Aktivität" pausiert.
      - name: Nachrichten-ID speichern / Repo aktiv halten
        run: |
          git config user.name "mc-status-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          git add status_message_id.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Statusnachricht gespeichert"
            git push || (git pull --rebase && git push)
          elif [ "$age_days" -ge 50 ]; then
            git commit --allow-empty -m "Keep-alive"
            git push || (git pull --rebase && git push)
          fi
